<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVCharging - Central</title>
    <style>
        /* Tipografía y variables base */
        :root {
            --bg-body: #fafafa;
            --text-main: #18181b;
            --text-muted: #71717a;
            --border-light: #e4e4e7;
            
            /* Colores de estado (intencionados y nítidos) */
            --status-active: #10b981;    /* Verde esmeralda */
            --status-charging: #0ea5e9;  /* Azul eléctrico */
            --status-stopped: #f59e0b;   /* Naranja ámbar */
            --status-error: #ef4444;     /* Rojo puro */
            --status-offline: #a1a1aa;   /* Gris zinc */
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Cabecera (Header + Subtítulo) */
        header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-light);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            margin: 0;
            color: var(--text-main);
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        /* Secciones */
        .section-header {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 16px;
            font-weight: 600;
        }

        /* Cuadrícula de CPs */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
            align-items: start; /* Evita que las tarjetas se estiren a lo alto si el vecino crece */
        }

        /* Tarjetas minimalistas con indicador lateral */
        .card {
            background: #ffffff;
            border: 1px solid var(--border-light);
            border-radius: 4px;
            padding: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: box-shadow 0.2s ease;
        }
        
        .card:hover {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }

        /* Indicador de estado lateral (franja) */
        .card::before {
            content: '';
            position: absolute;
            left: -1px;
            top: -1px;
            bottom: -1px;
            width: 4px;
            border-top-left-radius: 4px;
            border-bottom-left-radius: 4px;
        }

        .estado-activado::before { background-color: var(--status-active); }
        .estado-suministrando::before { background-color: var(--status-charging); }
        .estado-parado::before { background-color: var(--status-stopped); }
        .estado-averiado::before { background-color: var(--status-error); }
        .estado-desconectado::before { background-color: var(--status-offline); }

        .cp-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin: 0 0 16px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .estado-activado .status-badge { background: #d1fae5; color: #065f46; }
        .estado-suministrando .status-badge { background: #e0f2fe; color: #075985; }
        .estado-parado .status-badge { background: #fef3c7; color: #92400e; }
        .estado-averiado .status-badge { background: #fee2e2; color: #991b1b; }
        .estado-desconectado .status-badge { background: #f4f4f5; color: #3f3f46; }

        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            padding: 6px 0;
            border-bottom: 1px dashed #f4f4f5;
        }
        .info-row:last-of-type { border-bottom: none; }
        
        .label { color: var(--text-muted); }
        .value { font-weight: 500; font-variant-numeric: tabular-nums; }

        .extra-info {
            margin-top: 12px;
            padding: 12px;
            background: #f8fafc;
            border-radius: 4px;
            border-left: 2px solid var(--status-charging);
        }

        /* Botones */
        .actions {
            display: flex;
            gap: 8px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            background: transparent;
            border: 1px solid var(--border-light);
            color: var(--text-main);
            padding: 8px 0;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover { background: #f4f4f5; }
        
        .btn-stop:hover { border-color: var(--status-error); color: var(--status-error); background: #fef2f2; }
        .btn-reanudar:hover { border-color: var(--status-active); color: var(--status-active); background: #ecfdf5; }
        .btn-revocar { border-color: #fca5a5; color: #dc2626; margin-top: 8px; width: 100%; }
        .btn-revocar:hover { background: #fef2f2; border-color: #dc2626; }

        /* Widget del Clima */
        .weather-widget {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            border: 1px solid var(--border-light);
            border-radius: 4px;
            padding: 20px;
            margin-bottom: 40px;
        }

        .weather-info {
            display: flex;
            flex-direction: column;
        }

        .weather-title { font-weight: 600; }
        .weather-desc { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }

        .weather-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .temp-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .temp-input-wrapper input {
            width: 70px;
            font-size: 1.2rem;
            font-weight: 600;
            padding: 8px 24px 8px 12px;
            border: 1px solid var(--border-light);
            border-radius: 4px;
            text-align: center;
            outline: none;
            color: var(--text-main);
        }
        
        .temp-input-wrapper input:focus {
            border-color: var(--text-main);
        }

        .temp-input-wrapper span {
            position: absolute;
            right: 12px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .btn-save-weather {
            background: var(--text-main);
            color: white;
            border: none;
            padding: 10px 20px;
        }
        .btn-save-weather:hover { background: #3f3f46; color: white; }

        /* Consola de Logs */
        .log-container {
            background: #18181b; /* slate muy oscuro */
            border-radius: 6px;
            padding: 20px;
            height: 300px;
            overflow-y: auto;
            font-family: "JetBrains Mono", "SF Mono", Consolas, monospace;
            font-size: 0.85rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .log-line {
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            line-height: 1.4;
        }
        .log-line:last-child { border-bottom: none; }

        /* Colores terminal */
        .log-error { color: #f87171; }
        .log-success { color: #34d399; }
        .log-info { color: #38bdf8; }
        .log-warn { color: #fbbf24; }
        .log-default { color: #a1a1aa; }

        /* Custom Scrollbar para los logs */
        .log-container::-webkit-scrollbar { width: 8px; }
        .log-container::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        .log-container::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
        
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>EVCharging</h1>
        <div class="subtitle">Monitorización de puntos de recarga en tiempo real</div>
    </header>

    <div class="section-header">Puntos de Recarga</div>
    <div id="cp-container" class="grid-container">
        <!-- Renderizado JS -->
        <p style="color: var(--text-muted); grid-column: 1 / -1;">Cargando infraestructura térmica y eléctrica...</p>
    </div>

    <div class="section-header">Módulo Weather</div>
    <div class="weather-widget">
        <div class="weather-info">
            <div class="weather-title">Límite de Alerta Climática</div>
            <div class="weather-desc">Corte automático de suministro por sobrecalentamiento.</div>
        </div>
        <div class="weather-controls">
            <div class="temp-input-wrapper">
                <input type="number" id="temp-input" value="...">
                <span>ºC</span>
            </div>
            <button class="btn-save-weather" onclick="guardarLimiteClima()">Actualizar</button>
        </div>
    </div>

    <div class="section-header">Auditoría de Eventos</div>
    <div id="log-panel" class="log-container">
        <div class="log-line log-default">Conectando al stream de eventos...</div>
    </div>
</div>

<script>
    const API_BASE = "{{ api_base }}"; 

    async function cargarLimiteClima() {
        try {
            const resp = await fetch(`${API_BASE}/api/weather/config`);
            if (resp.ok) {
                const data = await resp.json();
                document.getElementById('temp-input').value = data.limite_temp;
            }
        } catch (e) { console.error("Error cargando límite clima", e); }
    }

    async function guardarLimiteClima() {
        const nuevoLimite = document.getElementById('temp-input').value;
        const btn = document.querySelector('.btn-save-weather');
        const originalText = btn.innerText;
        
        try {
            btn.innerText = "Guardando...";
            const resp = await fetch(`${API_BASE}/api/weather/config`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ limite_temp: nuevoLimite })
            });
            if (resp.ok) {
                btn.style.background = "#10b981";
                btn.innerText = "¡Actualizado!";
                setTimeout(() => {
                    btn.style.background = "";
                    btn.innerText = originalText;
                }, 2000);
            }
        } catch (e) {
            btn.style.background = "#ef4444";
            btn.innerText = "Error";
            setTimeout(() => { btn.style.background = ""; btn.innerText = originalText; }, 2000);
        }
    }

    async function actualizarDatos() {
        try {
            const respCP = await fetch(`${API_BASE}/cps`);
            if (respCP.ok) {
                const listaCP = await respCP.json();
                renderizarCP(listaCP);
            }
        } catch (error) { console.error("Error extraiendo CPs", error); }

        try {
            const respLog = await fetch(`${API_BASE}/api/logs`);
            if(respLog.ok) {
                const listaLog = await respLog.json();
                renderizarLogs(listaLog);
            }
        } catch (e) { console.error("Error extraiendo logs", e); }
    }

    function renderizarCP(cps) {
        const container = document.getElementById('cp-container');
        container.innerHTML = "";

        for (var i=0; i<cps.length; i++) {
            var cp = cps[i];
            var css = "estado-desconectado"; 
            if (cp.estado === "ACTIVADO") css = "estado-activado";
            else if (cp.estado === "SUMINISTRANDO") css = "estado-suministrando";
            else if (cp.estado === "PARADO") css = "estado-parado";
            else if (cp.estado === "AVERIADO") css = "estado-averiado";

            var div_cp = document.createElement("div");
            div_cp.className = "card " + css;

            var extra = "";
            if (cp.estado === "SUMINISTRANDO" && cp.info_carga) {
                extra =
                    "<div class='extra-info'>" +
                        "<div class='info-row'><span class='label'>Conductor</span><span class='value'>" + cp.info_carga.driver_id + "</span></div>" +
                        "<div class='info-row'><span class='label'>Energía</span><span class='value'>" + parseFloat(cp.info_carga.kwh).toFixed(2) + " kWh</span></div>" +
                        "<div class='info-row'><span class='label'>Coste</span><span class='value'>" + parseFloat(cp.info_carga.coste).toFixed(2) + " €</span></div>" +
                    "</div>";
            }

            const formatToken = cp.token ? cp.token.substring(0,8) + "..." : "Ninguno";

            div_cp.innerHTML =
                "<div class='cp-title'><span>" + cp.cp_id + "</span> <span class='status-badge'>" + cp.estado + "</span></div>" +
                "<div class='info-row'><span class='label'>Ubicación</span><span class='value'>" + cp.ubicacion + "</span></div>" +
                "<div class='info-row'><span class='label'>Tarifa</span><span class='value'>" + parseFloat(cp.precio).toFixed(2) + " €/kWh</span></div>" +
                "<div class='info-row'><span class='label'>Token Sesión</span><span class='value' style='font-family:monospace;'>" + formatToken + "</span></div>" + 
                extra +
                "<div class='actions'>" +
                    "<button class='btn-stop' onclick=\"accion('" + cp.cp_id + "','parar')\">Parar</button>" +
                    "<button class='btn-reanudar' onclick=\"accion('" + cp.cp_id + "','reanudar')\">Reanudar</button>" +
                "</div>" +
                "<button class='btn-revocar' onclick=\"accion('" + cp.cp_id + "','revocar')\">Revocar Credenciales</button>";

            container.appendChild(div_cp);
        }
    }

    function renderizarLogs(logs) {
        var panel = document.getElementById('log-panel');
        panel.innerHTML = "";

        for (var i=0; i<logs.length; i++) {
            var msg = logs[i];
            var div = document.createElement('div');
            div.className = "log-line ";

            // Lógica de colores terminal
            if (msg.includes("AVERIA") || msg.includes("FALLO") || msg.includes("DENEGADO") || (msg.includes("CLIMA") && msg.includes("alerta"))) {
                div.className += "log-error";
            } else if (msg.includes("CARGA_AUTORIZADA") || msg.includes("CONEXION") || (msg.includes("CLIMA") && msg.includes("normal"))) {
                div.className += "log-success";
            } else if (msg.includes("SOLICITUD_CARGA")) {
                div.className += "log-info";
            } else if (msg.includes("DESCONEXION") || msg.includes("SEGURIDAD") || msg.includes("PARADO")) {
                div.className += "log-warn";
            } else {
                div.className += "log-default";
            }
            
            div.innerText = msg;
            panel.appendChild(div);
        }
    }

    async function accion(id, tipo) {
        await fetch(`${API_BASE}/cps/${id}/${tipo}`, { method: 'POST' });
        actualizarDatos();
    }

    setInterval(actualizarDatos, 2000);
    actualizarDatos();
    cargarLimiteClima();
</script>

</body>
</html>
