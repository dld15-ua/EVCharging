version: '3.8'

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: evcharging-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    networks:
      - evcharging-net
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # --- Servidor Central ---
  central:
    build: ./services/central
    container_name: evcharging-central
    ports:
      - "${CENTRAL_API_PORT:-5001}:5001"
      - "${CENTRAL_SOCKET_PORT:-65000}:65000"
    environment:
      - BROKER_HOST=kafka
      - BROKER_PORT=9092
      - SOCKET_PORT=65000
      - API_PORT=5001
      - DB_PATH=/app/data/evcharging.db
      - CERT_FILE=/app/certs/server_cert.pem
      - KEY_FILE=/app/certs/server_key.pem
    volumes:
      - ./certs:/app/certs:ro
      - evcharging-db:/app/data
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - evcharging-net

  # --- Registro de CPs ---
  registry:
    build: ./services/registry
    container_name: evcharging-registry
    ports:
      - "${REGISTRY_PORT:-5000}:5000"
    environment:
      - CENTRAL_URL=https://central:5001
      - REGISTRY_PORT=5000
      - CERT_FILE=/app/certs/registry_cert.pem
      - KEY_FILE=/app/certs/registry_key.pem
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      - central
    networks:
      - evcharging-net

  # --- Engine CP ALC1 ---
  engine-alc1:
    build: ./services/engine
    container_name: evcharging-engine-alc1
    environment:
      - BROKER_HOST=kafka
      - BROKER_PORT=9092
      - CP_ID=ALC1
      - ENGINE_PORT=65001
      - ENGINE_INTERACTIVE=false
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - evcharging-net

  # --- Monitor CP ALC1 ---
  monitor-alc1:
    build: ./services/monitor
    container_name: evcharging-monitor-alc1
    environment:
      - CENTRAL_HOST=central
      - CENTRAL_PORT=65000
      - ENGINE_HOST=engine-alc1
      - ENGINE_PORT=65001
      - CP_ID=ALC1
      - UBICACION=Calle-ORIHUELA
      - REGISTRY_URL=https://registry:5000
      - AUTO_REGISTER=true
    depends_on:
      - central
      - registry
      - engine-alc1
    networks:
      - evcharging-net

  # --- Engine CP ALC2 ---
  engine-alc2:
    build: ./services/engine
    container_name: evcharging-engine-alc2
    environment:
      - BROKER_HOST=kafka
      - BROKER_PORT=9092
      - CP_ID=ALC2
      - ENGINE_PORT=65001
      - ENGINE_INTERACTIVE=false
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - evcharging-net

  # --- Monitor CP ALC2 ---
  monitor-alc2:
    build: ./services/monitor
    container_name: evcharging-monitor-alc2
    environment:
      - CENTRAL_HOST=central
      - CENTRAL_PORT=65000
      - ENGINE_HOST=engine-alc2
      - ENGINE_PORT=65001
      - CP_ID=ALC2
      - UBICACION=Calle-Politecnica
      - REGISTRY_URL=https://registry:5000
      - AUTO_REGISTER=true
    depends_on:
      - central
      - registry
      - engine-alc2
    networks:
      - evcharging-net

  # --- Conductor ---
  driver:
    build: ./services/driver
    container_name: evcharging-driver
    environment:
      - BROKER_HOST=kafka
      - BROKER_PORT=9092
      - DRIVER_ID=D001
    depends_on:
      kafka:
        condition: service_healthy
    stdin_open: true
    tty: true
    networks:
      - evcharging-net

  # --- Servicio de Clima ---
  weather:
    build: ./services/weather
    container_name: evcharging-weather
    environment:
      - CENTRAL_URL=https://central:5001
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - CIUDADES=Alicante:ALC1,Madrid:ALC2
      - LIMITE_TEMP=${LIMITE_TEMP:-20}
    depends_on:
      - central
    networks:
      - evcharging-net

networks:
  evcharging-net:
    driver: bridge

volumes:
  evcharging-db:
